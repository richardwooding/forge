# golangci-lint configuration (v2). The bar is zero issues.
#
# One exclusion, with its reason: forge writes its output to injected
# io.Writers so that tests can capture it, which defeats errcheck's built-in
# exemption for fmt.Fprint* to os.Stdout and os.Stderr. A failed write to the
# terminal is not something a CLI can do anything about.
#
# Everything else errcheck finds is handled at the call site with an explicit
# discard, so that a deliberate ignore reads differently from an oversight.
version: "2"
linters:
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Test fixtures for the wasm guests are not part of the module build.
      - path: testdata/
        linters:
          - typecheck
      # wazero's sys.File mandates Seek(int64, int) (int64, Errno); stdmethods
      # wants io.Seeker's error return, which would not implement the interface.
      - path: internal/capability/rootfs/file\.go
        linters:
          - govet
        text: "should have signature Seek"
formatters:
  enable:
    - gofmt
    - goimports
