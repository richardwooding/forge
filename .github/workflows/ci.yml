name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      # sdk is a separate module so guest binaries do not carry forge's own
      # dependencies. Build it both ways: wasip1 is the only target that
      # matters in production, but the host build is what lets vet and the
      # SDK's own tests run at all.
      - name: sdk
        working-directory: sdk
        run: |
          go build ./...
          go vet ./...
          go test ./...
          GOOS=wasip1 GOARCH=wasm go build ./...
      - run: go fix -diff ./...
      # stdmethods rejects wazero sys.File.Seek, whose signature its ABI mandates.
      # golangci-lint below keeps the check for every other package.
      - run: go vet -stdmethods=false ./...
      # The sandbox tests compile real wasip1 guests with the Go toolchain and
      # run them under wazero. They are the only tests that prove the jail, so
      # they are not behind a build tag -- but they are skipped by -short.
      - run: go test -race -timeout 600s -coverprofile=coverage.out ./...

  short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -short -timeout 120s ./...

  proto:
    name: generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # buf rather than protoc: it is a Go program, so it installs the same
      # way everything else here does and needs no system package.
      - run: go install github.com/bufbuild/buf/cmd/buf@latest
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - run: go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - run: buf lint
      - run: buf generate
      # Generated code is committed so that `go get` works without buf, which
      # means it can drift from the .proto. This is what notices.
      - run: git diff --exit-code -- grpcapi

      # go.mod is generated too, and nothing else here checks it: build, vet
      # and test all pass happily with a direct dependency still marked
      # indirect. That drift went unnoticed until goreleaser's own `go mod
      # tidy` hook dirtied the tree mid-release, which is a bad place to find
      # out.
      # The GUI's build output is committed, for the same reason grpcapi is:
      # `go install` must work with only a Go toolchain. So it can drift from
      # web/src, and only a diff notices. This step runs no node -- it fails
      # only if someone hand-edited dist. The scheduled web-sync workflow is
      # what actually rebuilds.
      - name: the GUI build output is committed
        run: git diff --exit-code -- web/dist

      - name: go.mod is tidy
        run: |
          go mod tidy
          (cd sdk && go mod tidy)
          git diff --exit-code -- go.mod go.sum sdk/go.mod sdk/go.sum

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      # The sdk is a separate module, so the root config does not reach it, and
      # it is built for two targets whose call graphs differ. Linting only the
      # host build would leave the wasm half unchecked.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: sdk
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: sdk
        env:
          GOOS: wasip1
          GOARCH: wasm
